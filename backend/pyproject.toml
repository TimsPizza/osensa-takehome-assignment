[project]
name = "backend"
version = "0.1.0"
description = "Async MQTT restaurant order processing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt==2.5.1",
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requires the local Mosquitto WebSocket Compose stack",
    "load: opt-in MQTT burst and saturation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
