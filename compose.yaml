name: osensa-restaurant

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2s
    depends_on:
      broker:
        condition: service_healthy

  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "--ws",
          "-h",
          "localhost",
          "-p",
          "9001",
          "-t",
          "$$SYS/broker/version",
          "-C",
          "1",
          "-W",
          "3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "9001"
      MQTT_WEBSOCKET_PATH: /mqtt
      MQTT_CLIENT_ID: osensa-order-service
      ORDER_WORKER_COUNT: "${ORDER_WORKER_COUNT:-8}"
      ORDER_QUEUE_CAPACITY: "${ORDER_QUEUE_CAPACITY:-256}"
      ORDER_REGISTRY_CAPACITY: "${ORDER_REGISTRY_CAPACITY:-4096}"
      MQTT_INCOMING_QUEUE_CAPACITY: "${MQTT_INCOMING_QUEUE_CAPACITY:-1024}"
      LOG_LEVEL: INFO
    depends_on:
      broker:
        condition: service_healthy
