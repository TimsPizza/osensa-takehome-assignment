# Development-only listener. Production authentication and TLS termination come later.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages false
sys_interval 1
max_packet_size 4096

listener 9001
protocol websockets
socket_domain ipv4
listener_allow_anonymous true
max_connections 50
max_qos 1
